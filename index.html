<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Daily Deutsch</title>
    <meta
      name="description"
      content="Learn German from A1 to B2 in a spoken class a day: a teacher asks, corrects you as you speak, and puts every mistake to you again on day 3, day 7 and day 21."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f3ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0b10" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Installed on a phone this runs full screen, with its own name under
         the icon. iOS reads the apple- prefixed pair; everyone else the
         manifest. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Deutsch" />

    <meta property="og:title" content="Daily Deutsch" />
    <meta property="og:description" content="A spoken German class a day, with a teacher who remembers your mistakes." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <script>
      // Apply the stored theme and language before first paint, so the page
      // never flashes the wrong one.
      try {
        var stored = localStorage.getItem("tagesdrill.theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var lang = localStorage.getItem("tagesdrill.lang");
        if (lang === "de" || lang === "en") document.documentElement.lang = lang;
      } catch (e) {
        /* private mode — defaults apply */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
